codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    # Repository-level Quality Gate (Monitors overall coverage trend)
    project:
      default:
        target: auto
        threshold: 0.5%
        if_ci_failed: error
      backend:
        flags:
          - backend
        target: auto
        threshold: 0.5%
      frontend:
        flags:
          - frontend
        target: auto
        threshold: 0.5%

    # Per-PR Patch Gate (Requires tests on new / modified lines)
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error
      backend:
        flags:
          - backend
        target: 80%
      frontend:
        flags:
          - frontend
        target: 80%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.Migrations.*"
  - "**/Migrations/**"
  - "tests/**"
  - "**/e2e/**"
  - "**/*.spec.ts"
  - "**/*.config.*"
  - "**/environments/**"
