name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test with Coverage
        run: >
          dotnet test
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: "TestResults/**/coverage.cobertura.xml"
          targetdir: "TestResults/CoverageReport"
          reporttypes: "Cobertura;MarkdownSummaryGithub"
          title: "Backend Coverage"

      - name: Publish Coverage to GitHub Step Summary
        run: cat TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: TestResults/CoverageReport/Cobertura.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend:
    name: Frontend Build & Unit Testing & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/QuizNova.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint CSS
        run: npm run lint:css

      - name: Build
        run: npm run build

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Generate Frontend Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        if: always()
        with:
          reports: "src/QuizNova.Client/coverage/lcov.info"
          targetdir: "src/QuizNova.Client/coverage/Report"
          reporttypes: "MarkdownSummaryGithub"
          title: "Frontend Coverage"

      - name: Publish Frontend Coverage to GitHub Step Summary
        if: always()
        run: |
          REPORT="$GITHUB_WORKSPACE/src/QuizNova.Client/coverage/Report/SummaryGithub.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: src/QuizNova.Client/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false



