name: Publish & Deploy Backend

on:
  push:
    branches: ["main", "develop", "staging"]
    paths:
      - "src/QuizNova.Api/**"
      - "src/QuizNova.Application/**"
      - "src/QuizNova.Domain/**"
      - "src/QuizNova.Infrastructure/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to deploy to"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      deploy_env: ${{ steps.env_calc.outputs.deploy_env }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate Target Environment
        id: env_calc
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "deploy_env=${{ inputs.target_env }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "deploy_env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=development" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set Tag Output
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/QuizNova.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.deploy_env }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set Environment Variables
        run: |
          ENV_NAME="${{ needs.build-and-push.outputs.deploy_env }}"
          if [ "$ENV_NAME" == "production" ]; then
            echo "DOPPLER_CONFIG=prd" >> $GITHUB_ENV
            echo "CONTAINER_APP_NAME=quiznova-api-prd" >> $GITHUB_ENV
          elif [ "$ENV_NAME" == "staging" ]; then
            echo "DOPPLER_CONFIG=stg" >> $GITHUB_ENV
            echo "CONTAINER_APP_NAME=quiznova-api-stg" >> $GITHUB_ENV
          else
            echo "DOPPLER_CONFIG=dev" >> $GITHUB_ENV
            echo "CONTAINER_APP_NAME=quiznova-api-dev" >> $GITHUB_ENV
          fi

      - name: Fetch Secrets from Doppler (OIDC)
        if: ${{ vars.DOPPLER_IDENTITY_ID != '' }}
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: quiznova-api
          doppler-config: ${{ env.DOPPLER_CONFIG }}

      - name: Downcase Repo Name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: quiznova-rg
          imageToDeploy: ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
