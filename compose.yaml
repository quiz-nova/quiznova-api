services:
  db:
    image: postgres:18.3
    container_name: quiznova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend

  mongodb:
    image: mongo:7.0
    container_name: quiznova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quiznova-mongodb-dev
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: src/QuizNova.Api/Dockerfile
    container_name: quiznova-api
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
        - /tmp:/tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      PostgresSettings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      MongoDbSettings__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      MongoDbSettings__DatabaseName: quiznova-mongodb-dev
      JwtSettings__Issuer: QuizNova.Api
      JwtSettings__Audiences__0: QuizNova.Client
      JwtSettings__Secret: ${JWT_SECRET:-QuizNova-Development-Secret-Key-Change-This-2026}
      JwtSettings__ExpiryMinutes: 7
      JwtSettings__RefreshTokenExpirationDays: 7
      CorsSettings__PolicyName: "QuizNovaCorsPolicy"
      CorsSettings__AllowedOrigins__0: "http://localhost:4200"
      RateLimiterSettings__DisableRateLimiting: "true"
      OTEL_SERVICE_NAME: quiznova-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,version=1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.us5.datadoghq.com
      OTEL_EXPORTER_OTLP_HEADERS: dd-api-key=${DATADOG_API_KEY}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      DOTNET_DiagnosticPorts: /tmp/quiznova-api.socket,listen,nosuspend
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend

  client:
    build:
      context: ./src/QuizNova.Client
      dockerfile: Dockerfile.dev

    container_name: quiznova-web

    volumes:
      - ./src/QuizNova.Client:/app
      - /app/node_modules

    restart: unless-stopped

    depends_on:
      api:
        condition: service_started

    environment:
      NODE_ENV: Development
    ports:
      - "4200:4200"

    networks:
      - frontend

volumes:
  postgres_data:
  mongodb_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

